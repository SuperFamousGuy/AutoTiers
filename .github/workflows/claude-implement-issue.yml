name: claude-implement-issue

# When a trusted author opens an issue, Claude implements it end-to-end on a
# branch; a follow-up step then opens a PR that closes the issue. The `gh pr
# create` call is AUTHENTICATED with a separate, Copilot-licensed token
# (PR_AUTHOR_PAT) rather than the action's OIDC App token. That distinction is
# what makes Copilot's automatic code review fire on the PR — Copilot reviews
# PRs created via a user/PAT credential, not ones created by the App's OIDC
# token. NOTE: the resulting PR still APPEARS authored by claude[bot] (a Bot
# identity) — see PRs #321/#324, both claude[bot]-authored, which received
# Copilot reviews. So the PAT governs *how the PR is created* (and thus that
# Copilot reviews it), not the displayed author. (An earlier comment here
# wrongly claimed App/bot-authored PRs are silently skipped by Copilot review;
# the live evidence contradicts that.)
# Copilot's reviews are auto-addressed by .github/workflows/claude-address-copilot-review.yml.
# Design: docs/superpowers/specs/2026-06-16-auto-implement-issues-design.md

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to (re-)implement end-to-end."
        required: true
        type: string

concurrency:
  group: claude-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action mints its GitHub token via OIDC

jobs:
  implement:
    name: implement issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SAFETY GATE: public repo. Only run for trusted authors so a stranger's
    # issue body cannot drive Claude with the repo's API key + write token.
    # github-actions[bot] resolves to NONE, so the action cannot recurse.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    steps:
      # Resolve the issue's number/title/author from EITHER the webhook payload
      # (opened/reopened) OR the workflow_dispatch input, into $GITHUB_ENV so
      # every later step reads one canonical source. Also: (a) fail closed if a
      # dispatched issue's author is not trusted (workflow_dispatch itself is
      # already write-access-gated by GitHub, but this is defense-in-depth so
      # neither a write-access human nor the sweeper can drive Claude on a
      # stranger's issue body); (b) clear stale terminal-state labels so they
      # always reflect THIS run; (c) on a human open/reopen only, reset the
      # sweeper's retry counter (a dispatch is the sweeper's own retry and must
      # keep the counter it just set).
      - name: Resolve issue context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_ISSUE_ASSOC: ${{ github.event.issue.author_association }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            num="$INPUT_ISSUE_NUMBER"
            title="$(gh issue view "$num" --repo "$REPO" --json title --jq .title)"
            assoc="$(gh issue view "$num" --repo "$REPO" --json authorAssociation --jq .authorAssociation)"
            case "$assoc" in
              OWNER|MEMBER|COLLABORATOR) : ;;
              *)
                echo "::error::Issue #$num author association '$assoc' is not trusted; refusing to implement." >&2
                exit 1 ;;
            esac
          else
            num="$EVENT_ISSUE_NUMBER"
            title="$EVENT_ISSUE_TITLE"
            assoc="$EVENT_ISSUE_ASSOC"
          fi

          # Export for later steps. Use the delimiter form for the title so a
          # quote or special char in it cannot break the env file.
          {
            echo "ISSUE_NUMBER=$num"
            echo "ISSUE_ASSOC=$assoc"
            echo "ISSUE_TITLE<<__EOT__"
            echo "$title"
            echo "__EOT__"
          } >> "$GITHUB_ENV"

          # Clear stale terminal-state labels so they reflect THIS run only.
          # `--remove-label` errors if the label isn't on the issue -> tolerate.
          gh issue edit "$num" --repo "$REPO" \
            --remove-label implement-failed --remove-label implement-blocked \
            2>/dev/null || true

          # Human open/reopen resets the sweeper's retry budget; a dispatch does not.
          # This reset is best-effort housekeeping: a transient `gh issue view`
          # error must NOT abort the (quota-expensive) implement run before it
          # starts, so the whole pipeline is `|| true` under `set -o pipefail`.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            gh issue view "$num" --repo "$REPO" --json labels \
              --jq '.labels[].name | select(startswith("implement-attempt-"))' \
              | while read -r lbl; do
                  [ -n "$lbl" ] && gh issue edit "$num" --repo "$REPO" --remove-label "$lbl" 2>/dev/null || true
                done || true
          fi

      - uses: actions/checkout@v4
        with:
          # Persist a PAT (not the default App OIDC token) as git's credential.
          # NOTE: this alone does NOT make the workflow-file push work. The
          # `claude-code-action` step below re-seats git's persisted credential
          # with its own minted OIDC App installation token, so by the time the
          # agent (or a later step) pushes, the checkout PAT has been overwritten
          # — and App tokens are blocked from writing under .github/workflows/.
          # That is exactly what failed live in issue #352 after PR #350 set
          # this token. The authoritative workflow-file push therefore lives in
          # the dedicated "Push implemented branch" step below, which re-asserts
          # the PAT on git's transport explicitly. This token is kept for any
          # pre-action git operations; the push step is what actually counts.
          token: ${{ secrets.PR_AUTHOR_PAT }}
          fetch-depth: 0

      # Pre-provision the toolchain so the SDLC test step is fast and reliable,
      # mirroring versions in .github/workflows/tests.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Implement issue
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max) instead of pay-per-token API. Token
          # generated locally via `claude setup-token`, stored as the
          # CLAUDE_CODE_OAUTH_TOKEN secret. Draws from the personal sub quota;
          # regenerate + update the secret if it expires.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are implementing GitHub issue #${{ env.ISSUE_NUMBER }} in
            this repository, end-to-end, with no further human input until a PR is
            open.

            Issue title: ${{ env.ISSUE_TITLE }}

            Read the full issue (title and body) for #${{ env.ISSUE_NUMBER }}
            and treat it as the spec for the change.

            Process — follow the repo's own lifecycle:
            1. Invoke the `autotiers-sdlc` skill and follow it for this change.
            2. Implement the change. Write tests alongside it.
            3. Run the relevant suites. The `autotiers-test-running` skill explains
               WHICH tests matter and the gotchas (OOM on `tests/test_sources`,
               warnings to ignore, the 80% diff-coverage gate), but its commands
               are written for a local checkout. THIS IS CI: ignore its
               `/Users/...` paths and `venv/bin/` prefix — dependencies are already
               installed on the runner. Run instead:
                 - backend:  `cd backend && pytest -q --ignore=tests/test_sources`
                 - web tests: `cd web && npx vitest run`
                 - web types: `cd web && npx tsc --noEmit`
            4. If tests do not pass, do NOT push a branch or write any PR files.
               Instead post a comment on issue
               #${{ env.ISSUE_NUMBER }} explaining the blocker, and stop.
            5. If tests pass, create a branch named
               `claude/issue-${{ env.ISSUE_NUMBER }}` and commit the
               work onto it. Do NOT push, and do NOT open the pull request
               yourself. A later workflow step pushes the branch authenticated
               as a Copilot-licensed user (your own `git push` would use the
               action's App token, which GitHub blocks from writing
               `.github/workflows/` files — see issue #352), and another step
               opens the PR so Copilot's automatic code review runs. Just leave
               the commit on the branch as the current `HEAD` and write two
               files at the repo root (do NOT commit them):
                 - `.pr-title.txt` — a concise one-line PR title.
                 - `.pr-body.md` — the PR body. It MUST start with
                   `Closes #${{ env.ISSUE_NUMBER }}` and summarize the
                   change, your assumptions, and any known gaps.

            The repo's `.claude/skills/` and `.claude/agents/` are present in the
            checkout — use them.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 80
            --allowedTools Edit,Write,Read,Glob,Grep,Bash,Task

      # Push the branch the agent committed, AUTHENTICATED as PR_AUTHOR_PAT, in a
      # step the action cannot override. The agent only commits (HEAD == the
      # branch tip); it does not push, because inside `claude-code-action` git's
      # credential is the action's minted OIDC App token, which GitHub refuses to
      # let write `.github/workflows/` files (the live #352 failure). `GH_TOKEN`
      # alone would not help — it steers `gh`, not raw `git push`. So we re-seat
      # git's transport explicitly: `-c http...extraheader=` clears the App-token
      # Authorization header the action persisted, and the inline token in the
      # remote URL authenticates the push as the PAT (which carries `workflow`
      # scope). Gated on .pr-body.md so a blocker run (no PR files) pushes
      # nothing, exactly as before.
      - name: Push implemented branch
        if: hashFiles('.pr-body.md') != ''
        env:
          PAT: ${{ secrets.PR_AUTHOR_PAT }}
          BRANCH: claude/issue-${{ env.ISSUE_NUMBER }}
          REPO: ${{ github.repository }}
        run: |
          # `-c` is a git-level option and MUST precede the `push` subcommand —
          # `git push -c ...` errors with "unknown switch `c`".
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${PAT}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"

      # Create the PR with `gh` AUTHENTICATED as PR_AUTHOR_PAT (a Copilot-licensed
      # user token) instead of the action's OIDC App token. Creating it via a
      # user/PAT credential is what triggers Copilot's automatic review; the PR
      # itself still appears authored by claude[bot] (see PRs #321/#324, which
      # were reviewed by Copilot). The implement step only pushed the branch and
      # wrote the PR text. Skipped automatically when that step stopped without
      # writing .pr-body.md (e.g. tests failed and it posted a blocker comment
      # instead).
      - name: Open pull request
        if: hashFiles('.pr-body.md') != ''
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          BRANCH: claude/issue-${{ env.ISSUE_NUMBER }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # Only an *open* PR for this branch should block a new one. gh pr view
          # also matches a previously-merged/closed PR on a reused branch name
          # (issue reopen), which would wrongly skip opening the new PR.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "Open PR already exists for $BRANCH; nothing to open."
            exit 0
          fi
          # Non-fatal read (step runs under bash -e) and collapse to one line so
          # --title never receives a missing file or embedded newline.
          title="$(head -n1 .pr-title.txt 2>/dev/null | tr -d '\r' || true)"
          [ -n "$title" ] || title="Implement issue #${{ env.ISSUE_NUMBER }}"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file .pr-body.md

      # Silent death: the job failed (e.g. Claude quota exhausted, timeout,
      # action error) before producing a PR. Mark the issue so a human browsing
      # issues sees it; the orphan sweeper re-dispatches it regardless of this
      # label (it keys on "no PR + no branch + not blocked").
      - name: Label silent failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create implement-failed --repo "$REPO" \
            --color d93f0b --description "Auto-implement job failed (e.g. Claude quota out)" \
            2>/dev/null || true
          gh issue edit "${ISSUE_NUMBER}" --repo "$REPO" --add-label implement-failed || true

      # Deliberate stop: the agent ran and SUCCEEDED at running, but wrote no
      # .pr-body.md — meaning tests failed and it posted a blocker comment
      # instead of opening a PR (the push/PR steps skipped on their hashFiles
      # gate; skipped steps do not fail, so success() holds). Mark it
      # `implement-blocked` so the orphan sweeper leaves it for a human.
      - name: Label deliberate blocker stop
        if: success() && hashFiles('.pr-body.md') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create implement-blocked --repo "$REPO" \
            --color fbca04 --description "Auto-implement stopped on a test blocker; needs a human" \
            2>/dev/null || true
          gh issue edit "${ISSUE_NUMBER}" --repo "$REPO" --add-label implement-blocked || true
