name: claude-implement-issue

# When a trusted author opens an issue, Claude implements it end-to-end on a
# branch; a follow-up step then opens a PR that closes the issue. The PR is
# opened with a separate, Copilot-licensed account (PR_AUTHOR_PAT) rather than
# the action's OIDC App token so that fix commits and the PR stay attributable
# to a Copilot-seated user. NOTE: the PR author still resolves to claude[bot]
# (a Bot identity) and Copilot's automatic code review DOES fire on these
# PRs — see PRs #321/#324, both claude[bot]-authored, which received Copilot
# reviews. (An earlier comment here wrongly claimed App/bot-authored PRs are
# silently skipped by Copilot review; the live evidence contradicts that.)
# Copilot's reviews are auto-addressed by .github/workflows/claude-address-copilot-review.yml.
# Design: docs/superpowers/specs/2026-06-16-auto-implement-issues-design.md

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action mints its GitHub token via OIDC

jobs:
  implement:
    name: implement issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SAFETY GATE: public repo. Only run for trusted authors so a stranger's
    # issue body cannot drive Claude with the repo's API key + write token.
    # github-actions[bot] resolves to NONE, so the action cannot recurse.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-provision the toolchain so the SDLC test step is fast and reliable,
      # mirroring versions in .github/workflows/tests.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Implement issue
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max) instead of pay-per-token API. Token
          # generated locally via `claude setup-token`, stored as the
          # CLAUDE_CODE_OAUTH_TOKEN secret. Draws from the personal sub quota;
          # regenerate + update the secret if it expires.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are implementing GitHub issue #${{ github.event.issue.number }} in
            this repository, end-to-end, with no further human input until a PR is
            open.

            Issue title: ${{ github.event.issue.title }}

            Read the full issue (title and body) for #${{ github.event.issue.number }}
            and treat it as the spec for the change.

            Process — follow the repo's own lifecycle:
            1. Invoke the `autotiers-sdlc` skill and follow it for this change.
            2. Implement the change. Write tests alongside it.
            3. Run the relevant suites. The `autotiers-test-running` skill explains
               WHICH tests matter and the gotchas (OOM on `tests/test_sources`,
               warnings to ignore, the 80% diff-coverage gate), but its commands
               are written for a local checkout. THIS IS CI: ignore its
               `/Users/...` paths and `venv/bin/` prefix — dependencies are already
               installed on the runner. Run instead:
                 - backend:  `cd backend && pytest -q --ignore=tests/test_sources`
                 - web tests: `cd web && npx vitest run`
                 - web types: `cd web && npx tsc --noEmit`
            4. If tests do not pass, do NOT push a branch or write any PR files.
               Instead post a comment on issue
               #${{ github.event.issue.number }} explaining the blocker, and stop.
            5. If tests pass, create a branch named
               `claude/issue-${{ github.event.issue.number }}`, commit the work,
               and push it. Do NOT open the pull request yourself — a later
               workflow step opens it under a Copilot-licensed account so that
               Copilot's automatic code review runs. Instead, write two files at
               the repo root (do NOT commit them):
                 - `.pr-title.txt` — a concise one-line PR title.
                 - `.pr-body.md` — the PR body. It MUST start with
                   `Closes #${{ github.event.issue.number }}` and summarize the
                   change, your assumptions, and any known gaps.

            The repo's `.claude/skills/` and `.claude/agents/` are present in the
            checkout — use them.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 80
            --allowedTools Edit,Write,Read,Glob,Grep,Bash,Task

      # Open the PR with a human, Copilot-seated account (PR_AUTHOR_PAT) instead
      # of the action's OIDC App token, so fix commits and the PR stay
      # attributable to a Copilot-seated user. (Copilot's automatic review fires
      # regardless — the PR author resolves to claude[bot] and Copilot still
      # reviews it; see PRs #321/#324.) The implement step only pushed the branch
      # and wrote the PR text. Skipped automatically when that step stopped
      # without writing .pr-body.md (e.g. tests failed and it posted a blocker
      # comment instead).
      - name: Open pull request
        if: hashFiles('.pr-body.md') != ''
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          BRANCH: claude/issue-${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # Only an *open* PR for this branch should block a new one. gh pr view
          # also matches a previously-merged/closed PR on a reused branch name
          # (issue reopen), which would wrongly skip opening the new PR.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "Open PR already exists for $BRANCH; nothing to open."
            exit 0
          fi
          # Non-fatal read (step runs under bash -e) and collapse to one line so
          # --title never receives a missing file or embedded newline.
          title="$(head -n1 .pr-title.txt 2>/dev/null | tr -d '\r' || true)"
          [ -n "$title" ] || title="Implement issue #${{ github.event.issue.number }}"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file .pr-body.md
