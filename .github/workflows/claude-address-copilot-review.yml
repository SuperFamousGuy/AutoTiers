name: claude-address-copilot-review

# Cron-driven sweeper. Auto-addresses GitHub Copilot's code review on every
# open same-repo PR, fully agentic (zero manual approvals).
#
# WHY CRON, NOT pull_request_review:
# Any workflow run TRIGGERED BY THE COPILOT BOT ACTOR is parked in
# `action_required` (awaiting manual human approval) on every run. GitHub
# provides no repo setting to disable this for the Copilot *reviewer* (the
# cloud-agent toggle only covers Copilot's coding agent, which this repo does
# not use). Loosening fork-PR-contributor-approval to
# `first_time_contributors_new_to_github` did NOT help (run 27735970457 still
# went action_required). So an event-driven `pull_request_review` trigger can
# never be fully agentic. A SCHEDULED (cron) workflow runs as the repo/owner
# identity and is NOT approval-gated -> fully agentic. We poll instead of react.
#
# TRIGGER CONDITION (replaces the old pull_request_review event):
# The work signal is "open same-repo PR with >=1 UNRESOLVED Copilot review
# thread" — any author, any branch. This is self-limiting: once Claude
# addresses + resolves the threads, the next tick sees none and does nothing;
# when Copilot re-reviews and opens new threads, the next tick acts again.
#
# COST: the sweeper makes gh API calls every tick even when idle. The scan step
# is structured to exit cheap BEFORE provisioning the toolchain or invoking
# Claude when there are no candidates / no unresolved Copilot threads.
#
# SCHEDULING CAVEATS:
#  - Scheduled workflows run ONLY from the version of this file on the DEFAULT
#    branch (main). This sweeper will NOT fire until PR #344 is merged. (This is
#    also why the old trigger couldn't be exercised on unrelated PRs.)
#  - GitHub cron can drift or skip ticks under load. Acceptable here: the work
#    signal is idempotent, so a skipped tick is just picked up by the next one.
#
# TERMINATION (MAX_PASSES=3) + FINAL-RESOLVE AT CAP:
# Per PR, an incrementing `claude-review-pass-K` label is stamped BEFORE Claude
# pushes. The scan counts existing `claude-review-pass-*` labels; at >=MAX_PASSES
# no further Claude passes run. Previously a capped PR was parked FOREVER (a
# one-time `claude-review-capped` label + notice, waiting for a human who never
# came): the 2026-07-12 backlog incident found 9 of 21 open PRs capped for up
# to 8 days — all CI-green and mergeable — because each Claude fix-push
# triggers a Copilot RE-review whose fresh nits burn the next pass, so 3
# passes never converge, and auto-merge gates on zero unresolved threads.
#
# Now, at cap, the scan runs FINAL-RESOLVE instead of parking: after 3 full
# address passes the remaining Copilot threads are nitpick-class by
# construction, so the scan replies to each remaining Copilot-authored thread,
# resolves it, and posts ONE summary comment recording the suggestions. Cap
# means "ship with noted nitpicks", not "abandon". Deterministic gh/GraphQL —
# no Claude, no quota. Human threads are NEVER touched (first-comment author
# must be the Copilot reviewer). Idempotent + re-entrant: a later push that
# spawns new Copilot threads on a capped PR just gets another final-resolve
# tick (resolving threads does not push code, so it cannot re-trigger a
# Copilot re-review — no loop). Gated by FINAL_RESOLVE_DRY_RUN below.

on:
  schedule:
    # Hourly. We previously ran `*/10`, but GitHub heavily THROTTLES
    # high-frequency cron on a low-activity repo: the */10 schedule was only
    # delivered ~every 2-2.5h in practice (observed gaps 120-176 min). A 10-min
    # cadence was never actually honored, so the config now states the cadence
    # GitHub will realistically deliver. This is fine: the work signal is
    # idempotent, so a Copilot re-review that misses one tick is simply picked
    # up by the next one. The idle path is cheap (scan-only).
    - cron: "0 * * * *"
  workflow_dispatch: # manual kick for testing
    inputs:
      final_resolve_dry_run:
        description: "Override FINAL_RESOLVE_DRY_RUN for a single manual run (true/false)."
        required: false
        type: string

concurrency:
  # Serialize sweeper ticks so two overlapping cron runs never both read the
  # same prior-pass counts and double-spend the budget. cancel-in-progress:false
  # lets an in-flight sweep finish (it may be mid-push) rather than be killed.
  group: claude-review-sweeper
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # PR labels are issue labels in GitHub's model
  id-token: write # claude-code-action mints its GitHub token via OIDC

env:
  # Max automatic Claude passes per PR. Tunable single source of truth.
  # 3 chosen as the smallest cap that allows a real back-and-forth (fix ->
  # Copilot re-review of the fix -> follow-up fix) while bounding token spend
  # and guaranteeing termination even if Copilot keeps finding nits.
  MAX_PASSES: 3
  # DRY_RUN (shipped "true" per repo convention): when a PR is at/over
  # MAX_PASSES and still has unresolved Copilot threads, final-resolve replies
  # to + resolves each remaining Copilot thread and posts one summary comment
  # (see FINAL-RESOLVE AT CAP above). While "true", the scan only LOGS what it
  # would resolve and keeps the legacy park-with-notice behaviour. Arm by
  # flipping to "false" after one dry-run tick logs sensible verdicts (or pass
  # the final_resolve_dry_run=false workflow_dispatch input for a single run).
  # ARMED 2026-07-22: capped PRs now auto reply+resolve remaining Copilot
  # threads instead of parking for a human. Caveat: the cap heuristic assumes
  # remaining threads are nitpick-class; a genuine bug surviving 3 passes (e.g.
  # PR #816's skip-link focus gap) will be auto-resolved as a "noted nitpick".
  FINAL_RESOLVE_DRY_RUN: "false"

jobs:
  # STAGE 1 (cheap): scan for eligible PRs. Pure gh/GraphQL, no toolchain, no
  # Claude. Emits a JSON array of eligible PR numbers as `matrix` and a boolean
  # `any`. When `any` is false the address job is skipped entirely, so the idle
  # path costs only the gh calls in this job.
  scan:
    name: scan for copilot-reviewed claude PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Find eligible PRs
        id: scan
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          REPO: ${{ github.repository }}
          FINAL_RESOLVE_DRY_RUN_OVERRIDE: ${{ github.event.inputs.final_resolve_dry_run }}
        run: |
          set -euo pipefail
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # Candidate PRs: the open same-repo PRs returned by `gh pr list`, up to
          # its 100-result page (no pagination — this repo never approaches 100
          # open PRs; if that ever changes, add --paginate or a cursor loop). We
          # no longer filter by author or head-branch prefix — the sweeper
          # addresses Copilot review feedback on all of them. (Author filtering
          # became unreliable anyway: PRs opened by
          # claude-implement-issue.yml are attributed to the subscription-auth
          # account, not the `claude[bot]` GitHub App, so a `claude[bot]` filter
          # silently excluded them.) The real work signal is "open same-repo PR
          # with >=1 unresolved Copilot thread", checked per-candidate below.
          #
          # The isCrossRepository guard stays: it keeps the sweeper strictly
          # scoped to this repo's own branches. A fork PR cannot be pushed to with
          # our PAT and would be checked out by ref against the wrong repo and
          # fail (and should never be auto-addressed regardless).
          candidates="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false) | .number]')"
          echo "candidate PRs (open same-repo, up to 100): $candidates"

          eligible='[]'
          for pr in $(echo "$candidates" | python3 -c 'import json,sys; print(" ".join(str(n) for n in json.load(sys.stdin)))'); do
            # Count UNRESOLVED review threads authored by the Copilot reviewer.
            # Copilot surfaces under several logins depending on the API surface:
            # "Copilot", "copilot-pull-request-reviewer" (current, no suffix), or
            # "copilot-pull-request-reviewer[bot]". Match all three. We consider a
            # thread a Copilot thread if its FIRST comment's author is Copilot.
            unresolved="$(gh api graphql \
              -f query='
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 50) {
                      nodes {
                        isResolved
                        comments(first: 1) { nodes { author { login } } }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$NAME" -F pr="$pr" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                       | select(.isResolved == false)
                       # Null-safe: a ghost/deleted first-comment author yields no
                       # login rather than tripping the filter, so one odd thread
                       # cannot fail the whole scan job.
                       | (.comments.nodes[0].author.login // empty)
                       | select(. == "Copilot" or . == "copilot-pull-request-reviewer" or . == "copilot-pull-request-reviewer[bot]")]
                    | length')"

            # Count prior Claude passes; if at/over cap, the PR is not eligible
            # (the address job would skip it anyway, but excluding it here keeps
            # the idle path from spinning up the toolchain for a capped PR).
            passes="$(gh pr view "$pr" --repo "$REPO" --json labels \
              --jq '[.labels[].name | select(startswith("claude-review-pass-"))] | length')"

            echo "PR #$pr: unresolved Copilot threads=$unresolved, prior passes=$passes"
            if [ "$unresolved" -gt 0 ] && [ "$passes" -lt "$MAX_PASSES" ]; then
              eligible="$(echo "$eligible" | python3 -c "import json,sys; a=json.load(sys.stdin); a.append($pr); print(json.dumps(a))")"
            elif [ "$unresolved" -gt 0 ] && [ "$passes" -ge "$MAX_PASSES" ]; then
              # Cap reached AND still-unresolved Copilot threads: FINAL-RESOLVE
              # (see header). Fetch the remaining Copilot-authored unresolved
              # threads as TSV rows: node id, path, line, first-comment excerpt.
              # Excerpt is newline/tab-flattened so @tsv rows stay one-line.
              gh api graphql \
                -f query='
                query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100) {
                        nodes {
                          id
                          isResolved
                          path
                          line
                          comments(first: 1) { nodes { author { login } body } }
                        }
                      }
                    }
                  }
                }' -f owner="$OWNER" -f repo="$NAME" -F pr="$pr" \
                --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                        | select(.isResolved == false)
                        | select((.comments.nodes[0].author.login // empty)
                                 | . == "Copilot" or . == "copilot-pull-request-reviewer" or . == "copilot-pull-request-reviewer[bot]")
                        | [.id,
                           (.path // "—"),
                           ((.line // 0) | tostring),
                           ((.comments.nodes[0].body // "") | gsub("[\r\n\t]+"; " ") | .[0:160])]
                        | @tsv' > /tmp/cap_threads.tsv

              count="$(grep -c . /tmp/cap_threads.tsv || true)"
              dry_run="${FINAL_RESOLVE_DRY_RUN_OVERRIDE:-$FINAL_RESOLVE_DRY_RUN}"

              # Fail-safe arm guard: ONLY the explicit string "false" arms
              # final-resolve. Any other value ("True", "FALSE", "", a typo)
              # stays dry — matching the repo's arm-guard convention so a
              # mangled env value can never start resolving threads by accident.
              if [ "$dry_run" != "false" ]; then
                echo "PR #$pr: capped with $count unresolved Copilot thread(s); FINAL_RESOLVE_DRY_RUN — would reply to + resolve:"
                sed 's/^/  would resolve: /' /tmp/cap_threads.tsv
                # Legacy park-with-notice behaviour stays while dry:
                already="$(gh pr view "$pr" --repo "$REPO" --json labels \
                  --jq '[.labels[].name | select(. == "claude-review-capped")] | length')"
                if [ "$already" -eq 0 ]; then
                  gh label create "claude-review-capped" --repo "$REPO" \
                    --color b60205 --description "Auto-address cap (MAX_PASSES) reached; needs human" \
                    2>/dev/null || true
                  gh pr edit "$pr" --repo "$REPO" --add-label "claude-review-capped"
                  gh pr comment "$pr" --repo "$REPO" --body \
                    "Automated Copilot-review passes hit the cap (MAX_PASSES=${MAX_PASSES}). There are still unresolved Copilot threads. A human should review and resolve them, then remove the \`claude-review-pass-*\` labels to re-arm the sweeper."
                  echo "PR #$pr: capped; posted one-time notice."
                else
                  echo "PR #$pr: capped; notice already posted, skipping."
                fi
              elif [ "$count" -gt 0 ]; then
                # ARMED: reply first, then resolve (resolving before replying
                # detaches the reply from the visible thread — see the
                # resolve-pr-comments skill), accumulating the summary as we go.
                printf '%s\n\n' \
                  "Automated review passes hit the cap (MAX_PASSES=${MAX_PASSES}). After ${MAX_PASSES} full address passes the remaining Copilot suggestions are recorded below and their threads resolved, so nitpick-class feedback does not park an otherwise-mergeable PR indefinitely (auto-merge gates on zero unresolved threads). Any suggestion worth acting on should be filed as an issue." \
                  > /tmp/cap_summary.md
                # Per-thread failures are contained (|| warn + skip): one bad
                # thread must not abort the scan job (set -e) and starve every
                # other PR in this tick. A skipped thread stays unresolved and
                # is simply retried on the next cron tick — worst case a
                # reply-then-failed-resolve leaves a duplicate reply next tick,
                # which is acceptable noise.
                resolved_count=0
                while IFS="$(printf '\t')" read -r tid path line excerpt; do
                  [ -n "$tid" ] || continue
                  echo "PR #$pr: final-resolving thread $tid ($path:$line)"
                  if ! gh api graphql \
                    -f query='
                    mutation($threadId: ID!, $body: String!) {
                      addPullRequestReviewThreadReply(input: { pullRequestReviewThreadId: $threadId, body: $body }) {
                        comment { id }
                      }
                    }' -f threadId="$tid" \
                    -f body="Pass cap reached (MAX_PASSES=${MAX_PASSES}). Recording this suggestion in the cap summary comment and resolving the thread so it does not block the merge queue indefinitely. If it warrants action, it should be filed as an issue." \
                    >/dev/null; then
                    echo "::warning::PR #$pr: reply failed for thread $tid; leaving it for the next tick."
                    continue
                  fi
                  if ! gh api graphql \
                    -f query='
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: { threadId: $threadId }) {
                        thread { id isResolved }
                      }
                    }' -f threadId="$tid" >/dev/null; then
                    echo "::warning::PR #$pr: resolve failed for thread $tid; leaving it for the next tick."
                    continue
                  fi
                  resolved_count=$((resolved_count + 1))
                  printf -- '- `%s:%s` — %s\n' "$path" "$line" "$excerpt" >> /tmp/cap_summary.md
                done < /tmp/cap_threads.tsv
                if [ "$resolved_count" -gt 0 ]; then
                  gh pr comment "$pr" --repo "$REPO" --body-file /tmp/cap_summary.md || \
                    echo "::warning::PR #$pr: cap summary comment failed to post (threads already resolved)."
                fi
                # Keep the capped label as an audit marker (it no longer means
                # "needs human" once final-resolve is armed).
                gh label create "claude-review-capped" --repo "$REPO" \
                  --color b60205 --description "Auto-address cap (MAX_PASSES) reached; remaining threads final-resolved" \
                  2>/dev/null || true
                gh pr edit "$pr" --repo "$REPO" --add-label "claude-review-capped" 2>/dev/null || true
                echo "PR #$pr: final-resolved $resolved_count of $count thread(s)."
              else
                echo "PR #$pr: capped but no Copilot-authored unresolved threads matched; nothing to final-resolve."
              fi
            fi
          done

          echo "eligible PRs: $eligible"
          echo "matrix=$eligible" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$eligible" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  # STAGE 2 (expensive): one job per eligible PR. Skipped wholesale when scan
  # found nothing, so the toolchain + Claude only run when there is real work.
  address:
    name: address copilot review (PR #${{ matrix.pr }})
    needs: scan
    if: needs.scan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Sequential (max-parallel 1) so passes are reserved one PR at a time and
      # the shared subscription quota is not hit by N concurrent Claude runs.
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.scan.outputs.matrix) }}
    steps:
      # FIRST step: decide whether there is budget, but DO NOT stamp yet. Counting
      # is cheap and gates the expensive toolchain/Claude steps below. The actual
      # pass-label stamp is deferred to just before the Claude step (see "Stamp
      # pass label") so that an infra failure in checkout/setup/install does not
      # consume a pass without any fix ever being attempted.
      - name: Count prior passes (decide budget)
        id: budget
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          PR: ${{ matrix.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prior="$(gh pr view "$PR" --repo "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("claude-review-pass-"))] | length')"
          echo "prior passes: $prior  cap: $MAX_PASSES"
          if [ "$prior" -ge "$MAX_PASSES" ]; then
            echo "Cap reached ($prior >= $MAX_PASSES); no budget left. Stopping."
            echo "has_budget=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$((prior + 1))
          echo "Budget available: pass $next of $MAX_PASSES (label stamped later)."
          echo "next_label=claude-review-pass-${next}" >> "$GITHUB_OUTPUT"
          echo "has_budget=true" >> "$GITHUB_OUTPUT"

      - name: Resolve PR head branch
        id: head
        if: steps.budget.outputs.has_budget == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          PR: ${{ matrix.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ref="$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName')"
          echo "head ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.budget.outputs.has_budget == 'true'
        uses: actions/checkout@v4
        with:
          # Push fix commits under the Copilot-seated account so they stay
          # attributable and do not re-trigger as a different identity.
          token: ${{ secrets.PR_AUTHOR_PAT }}
          ref: ${{ steps.head.outputs.ref }}
          fetch-depth: 0

      # Pre-provision the toolchain so the CI test step is fast and reliable,
      # mirroring versions in tests.yml / claude-implement-issue.yml.
      - uses: actions/setup-python@v5
        if: steps.budget.outputs.has_budget == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps
        if: steps.budget.outputs.has_budget == 'true'
        working-directory: backend
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        if: steps.budget.outputs.has_budget == 'true'
        with:
          # Mirrors tests.yml: jsdom 30's undici 8 dep calls
          # worker_threads.markAsUncloneable, a Node 22+ API.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        if: steps.budget.outputs.has_budget == 'true'
        working-directory: web
        run: npm ci

      # Stamp the pass label NOW — after the toolchain is provisioned and right
      # before Claude runs/pushes. This preserves the termination invariant
      # (label exists before the push that triggers Copilot's re-review, so the
      # next cron tick observes the incremented count and stops at the cap) while
      # ensuring a runner/setup/registry failure earlier in the job does not burn
      # a pass. Adding an already-present label is a no-op, so a retried run
      # cannot double-count.
      - name: Stamp pass label (reserve budget)
        if: steps.budget.outputs.has_budget == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          PR: ${{ matrix.pr }}
          REPO: ${{ github.repository }}
          LABEL: ${{ steps.budget.outputs.next_label }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --repo "$REPO" \
            --color ededed --description "Automated Claude pass addressing Copilot review" \
            2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"
          echo "Reserved budget: stamped $LABEL."

      - name: Address Copilot review (commit only, do not push)
        if: steps.budget.outputs.has_budget == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Attribute Claude's `gh` reply/resolve calls (run by resolve-pr-comments)
          # to the Copilot-seated PAT account rather than the action's default
          # GITHUB_TOKEN (github-actions[bot]). gh prefers GH_TOKEN over
          # GITHUB_TOKEN, so this wins for any gh invocation inside the agent.
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
        with:
          # Subscription auth (Pro/Max), same as claude-implement-issue.yml.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            GitHub Copilot's code reviewer has left unresolved review threads on
            PR #${{ matrix.pr }} in this repository. Address them end-to-end on
            the current branch (${{ steps.head.outputs.ref }}), with no further
            human input.

            CRITICAL — read this before you start. Do NOT `git push` and do NOT
            resolve any review thread inside this step. A Copilot fix can edit a
            file under `.github/workflows/`, and a `git push` from inside this
            action goes out as the action's GitHub App OIDC token (the action
            re-seats git's credential after checkout), which GitHub REFUSES to
            let write workflow files. Pushing here would fail exactly that way.
            A later workflow step pushes the branch authenticated as the
            Copilot-licensed PAT (which carries `workflows` scope), and a step
            after THAT resolves the threads — but only once the push has actually
            landed. If you resolve threads here, a failed push would leave threads
            marked resolved with no fix on the remote (silent bad state). So:
            commit + reply ONLY; never push, never resolve.

            Process:
            1. Invoke the `resolve-pr-comments` skill and run it for PR
               #${{ matrix.pr }}. Triage every UNRESOLVED Copilot review thread
               (Act / Decline / Defer). For each Act decision, make the fix on
               this branch. Ignore threads authored by anyone other than Copilot
               (`Copilot` / `copilot-pull-request-reviewer` /
               `copilot-pull-request-reviewer[bot]`).
            2. After applying fixes, run the suites. THIS IS CI: ignore any
               local `/Users/...` paths or `venv/bin/` prefixes in skills —
               dependencies are already installed on the runner. Run exactly:
                 - backend: `cd backend && pytest -q --ignore=tests/test_sources`
                 - web tests: `cd web && npx vitest run`
                 - web types: `cd web && npx tsc --noEmit`
            3. If ANY suite fails: do NOT commit, do NOT push, do NOT resolve.
               Post a comment on the PR explaining what you changed and why it
               could not land (with the failing output), then STOP. Do NOT write
               the `.addressed.flag` file.
            4. If all suites pass: commit the fixes with a conventional-style
               message (e.g. `fix: address Copilot review on PR
               #${{ matrix.pr }}`). Leave the commit as the current branch HEAD.
               Do NOT push it — a later step pushes it as the PAT. Then REPLY to
               each addressed Copilot thread (a reply is a plain comment and is
               safe to post before the push), but do NOT resolve any thread yet —
               a later step resolves them only after the push succeeds. Finally,
               write a sentinel file at the repo root named `.addressed.flag`
               (any content) so the push and resolve steps know a fix was
               committed. Do NOT commit `.addressed.flag`. Do NOT open a new pull
               request. Do NOT re-request Copilot review.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 80
            --allowedTools Edit,Write,Read,Glob,Grep,Bash,Task

      # Push the agent's commit, AUTHENTICATED as PR_AUTHOR_PAT, in a step the
      # action cannot override. This is the same fix shipped for the auto-implement
      # pipeline in PR #353 (see claude-implement-issue.yml "Push implemented
      # branch"): the agent only COMMITS, because inside claude-code-action git's
      # credential is the action's minted OIDC App token, which GitHub refuses to
      # let write `.github/workflows/` files (the live #358 failure on
      # claude-sweeper-health.yml). `GH_TOKEN` alone would not help — it steers
      # `gh`, not raw `git push`. So we re-seat git's transport explicitly:
      # `-c http...extraheader=` clears the App-token Authorization header the
      # action persisted, and the inline token in the remote URL authenticates
      # the push as the PAT (which carries `workflows` + `contents` scope). Gated
      # on the `.addressed.flag` sentinel so a suites-failed / no-fix run (no
      # flag) pushes nothing.
      - name: Push addressed branch
        if: steps.budget.outputs.has_budget == 'true' && hashFiles('.addressed.flag') != ''
        env:
          PAT: ${{ secrets.PR_AUTHOR_PAT }}
          REF: ${{ steps.head.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `-c` is a git-level option and MUST precede the `push` subcommand —
          # `git push -c ...` errors with "unknown switch `c`".
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${PAT}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${REF}"

      # Resolve the Copilot threads ONLY after the push has landed. Splitting
      # resolution out of the address step (and gating it on the push step
      # succeeding) is the ordering decision that prevents the silent-bad-state
      # failure: a thread is never marked resolved unless the fix is actually on
      # the remote. `if: success()` ensures a failed push short-circuits this
      # step, leaving the threads open for the next cron tick to retry. Gated on
      # the same `.addressed.flag` sentinel so a no-fix run does not resolve
      # nothing.
      #
      # This is plain bash (gh GraphQL), NOT a second claude-code-action run. The
      # address step already did the only judgement-bearing work (triage + fix +
      # reply); resolving a thread by node `id` is deterministic and scriptable,
      # so spinning up a whole agent (and drawing subscription quota) just to call
      # one mutation per thread was pure waste (see issue #361). We fetch the
      # UNRESOLVED threads whose FIRST comment author is Copilot AND that already
      # carry a reply (a comment from someone other than Copilot — the address
      # step posts that reply before the push) and resolve each via the
      # `resolveReviewThread` mutation, keyed by the thread node `id` (opaque
      # PRRT_…, NOT a comment databaseId — see the resolve-pr-comments skill).
      - name: Resolve Copilot threads (after push)
        if: success() && steps.budget.outputs.has_budget == 'true' && hashFiles('.addressed.flag') != ''
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          PR: ${{ matrix.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # Collect the thread node IDs to resolve. A thread qualifies when ALL of:
          #   - it is unresolved (isResolved == false),
          #   - its FIRST comment's author is the Copilot reviewer (any of the
          #     three logins it surfaces under), and
          #   - it already carries a reply, i.e. at least one comment whose author
          #     is NOT Copilot (the reply the address step posted before the push).
          # The non-Copilot-reply check — rather than a bare "more than one
          # comment" — guards the edge where Copilot posts multiple comments in one
          # thread with no human/agent reply: such a thread is left open.
          ids="$(gh api graphql \
            -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 50) {
                    nodes {
                      id
                      isResolved
                      comments(first: 100) { nodes { author { login } } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f repo="$NAME" -F pr="$PR" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                    | select(.isResolved == false)
                    # First comment must be Copilot. Null-safe: a ghost/deleted
                    # first-comment author yields no login and is skipped rather
                    # than tripping the filter.
                    | select((.comments.nodes[0].author.login // empty)
                             | . == "Copilot" or . == "copilot-pull-request-reviewer" or . == "copilot-pull-request-reviewer[bot]")
                    # Must carry a reply: some comment author is not Copilot.
                    | select([.comments.nodes[].author.login // empty
                              | select(. != "Copilot" and . != "copilot-pull-request-reviewer" and . != "copilot-pull-request-reviewer[bot]")]
                             | length > 0)
                    | .id')"

          if [ -z "$ids" ]; then
            echo "No replied-to unresolved Copilot threads to resolve."
            exit 0
          fi

          while IFS= read -r tid; do
            [ -n "$tid" ] || continue
            echo "Resolving Copilot thread $tid"
            gh api graphql \
              -f query='
              mutation($threadId: ID!) {
                resolveReviewThread(input: { threadId: $threadId }) {
                  thread { id isResolved }
                }
              }' -f threadId="$tid" >/dev/null
          done <<< "$ids"
          echo "Resolved all replied-to Copilot threads on PR #${PR}."
