name: claude-triage-dispatch

# Deterministic throttle between the improvement recommender and the
# auto-implementer. The recommender files backlog issues labelled `triage-queued`
# with a `<!-- autotiers:rec score=N -->` body marker. This workflow reacts to a
# freed slot (a PR closing) or new intake (an issue opening), counts in-flight
# `claude/issue-*` PRs, and dispatches the top-score queued issues to
# claude-implement-issue.yml to fill up to CAP concurrent slots. It invokes NO
# Claude — selection is a pure Python decision core.
#
# TOKEN SPLIT (correctness-critical): the `gh workflow run` DISPATCH uses
# PR_AUTHOR_PAT, because a GITHUB_TOKEN-triggered workflow_dispatch is suppressed
# by GitHub's recursion guard (same rule as the orphan sweeper). Label writes use
# the built-in GITHUB_TOKEN.
#
# Ships DRY_RUN-safe: report-only until a human confirms the dispatch decisions
# against real backlog state, then flip DRY_RUN to "false" in a one-line commit
# to arm real label removal + dispatch (mirrors the orphan sweeper's rollout).
#
# Design: docs/superpowers/specs/2026-07-21-triage-dispatch-throttle-design.md

on:
  pull_request:
    types: [closed] # a slot may have freed
  issues:
    types: [opened, reopened] # cold-start seed: start an empty pipe
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Override DRY_RUN for a single manual run (true/false)."
        required: false
        type: string

concurrency:
  # Serialize ticks so two events never both dispatch (and double-drain) slots.
  group: claude-triage-dispatch
  cancel-in-progress: false

permissions:
  contents: read # actions/checkout for the decision core
  issues: write # remove the triage-queued label on dispatch
  pull-requests: read # count in-flight claude/issue-* PRs

env:
  # Ship SAFE: report-only until a human confirms the dispatch decisions against
  # real backlog state, then flip to "false" in a one-line commit to arm it.
  # ARMED 2026-07-22: now meters top-score backlog issues into
  # claude-implement-issue at CAP below (autonomous issue->implement pipeline,
  # spends quota). Re-safe by flipping "true".
  DRY_RUN: "false"
  CAP: "2" # max concurrent open auto-implement PRs
  QUEUED_LABEL: "triage-queued"
  IMPLEMENT_WORKFLOW: claude-implement-issue.yml

jobs:
  dispatch:
    name: dispatch queued recommendations to fill open slots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Scan, plan, and dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR_PAT: ${{ secrets.PR_AUTHOR_PAT }}
          REPO: ${{ github.repository }}
          DRY_RUN_OVERRIDE: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_run="${DRY_RUN_OVERRIDE:-$DRY_RUN}"
          echo "DRY_RUN=$dry_run"

          # --- Gather the world -----------------------------------------------
          # In-flight = open PRs whose head is a `claude/issue-N` branch.
          inflight="$(gh pr list --repo "$REPO" --state open --limit 300 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | test("^claude/issue-[0-9]+$"))] | length')"

          # Queued backlog issues with body + label names.
          gh issue list --repo "$REPO" --label "$QUEUED_LABEL" --state open \
            --limit 200 --json number,body,labels \
            --jq '[.[] | {number, body, labels: [.labels[].name]}]' > queued.json

          jq -n \
            --arg cap "$CAP" \
            --arg inflight "$inflight" \
            --arg queued "$QUEUED_LABEL" \
            --slurpfile issues queued.json \
            '{cap: ($cap|tonumber), inflight: ($inflight|tonumber),
              queued_label: $queued, issues: $issues[0]}' > world.json

          echo "::group::world.json"; cat world.json; echo "::endgroup::"

          # --- Decide ---------------------------------------------------------
          python3 backend/scripts/triage_dispatch.py --world world.json > plan.json
          echo "::group::plan.json"; cat plan.json; echo "::endgroup::"

          slots="$(jq -r .slots plan.json)"
          count="$(jq -r '.dispatch | length' plan.json)"
          {
            echo "### Triage dispatch"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| CAP | $CAP |"
            echo "| in-flight PRs | $inflight |"
            echo "| free slots | $slots |"
            echo "| dispatched | $count |"
            echo "| DRY_RUN | $dry_run |"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- Act ------------------------------------------------------------
          # For each selected issue: drop triage-queued (GITHUB_TOKEN) so it is
          # never re-selected, then dispatch implement (PR_AUTHOR_PAT — a
          # GITHUB_TOKEN dispatch no-ops). Order matters: remove the label first
          # so a mid-loop failure can't leave a dispatched issue still queued
          # (it would be re-selected next tick and burn a second Opus run on the
          # same issue).
          #
          # That ordering needs a COMPENSATING RESTORE for the other direction.
          # If the dispatch fails after the label is already gone, the issue is
          # queued nowhere — invisible to this dispatcher and to the orphan
          # sweeper — and is silently lost forever. That is not hypothetical: for
          # ~1 month PR_AUTHOR_PAT lacked Actions:Write, every dispatch 403'd,
          # and 89 issues had to be re-labelled by hand to recover them. So on a
          # dispatch failure we put the label back, and the step still exits
          # non-zero so the run goes RED rather than silently green.
          #
          # Loop reads from process substitution (not a `... | while` pipeline)
          # so the failure counter lives in this shell, not a subshell.
          dispatch_failures=0
          while read -r row; do
            n="$(echo "$row" | jq -r .number)"
            s="$(echo "$row" | jq -r .score)"
            echo "dispatch #$n (score $s)"
            # Fail-safe: ARM only when DRY_RUN is exactly "false". Any other value
            # (an unset var, a typo like "False"/"0", or the default "true") stays
            # report-only, so a mistyped flag can never silently arm dispatch.
            if [ "$dry_run" != "false" ]; then
              echo "(dry-run) would drop '$QUEUED_LABEL' and dispatch $IMPLEMENT_WORKFLOW for #$n."
              continue
            fi
            # If the label removal itself fails, do NOT dispatch: the issue would
            # be running AND still queued, i.e. double-dispatched next tick.
            if ! gh issue edit "$n" --repo "$REPO" --remove-label "$QUEUED_LABEL"; then
              echo "::error::could not remove '$QUEUED_LABEL' from #$n; skipping its dispatch to avoid a double-dispatch next tick."
              dispatch_failures=$((dispatch_failures + 1))
              continue
            fi
            if ! GH_TOKEN="$PR_AUTHOR_PAT" gh workflow run "$IMPLEMENT_WORKFLOW" \
              --repo "$REPO" -f issue_number="$n"; then
              echo "::error::dispatch of #$n failed; restoring '$QUEUED_LABEL' so it stays in the queue."
              # Best-effort: if the restore ALSO fails the issue really is
              # orphaned, so say so explicitly — that is the only signal a human
              # gets that a specific issue needs re-labelling by hand.
              gh issue edit "$n" --repo "$REPO" --add-label "$QUEUED_LABEL" \
                || echo "::error::could not restore '$QUEUED_LABEL' on #$n — that issue is now ORPHANED (queued nowhere). Re-add the label manually."
              dispatch_failures=$((dispatch_failures + 1))
            fi
          done < <(jq -c '.dispatch[]' plan.json)

          if [ "$dispatch_failures" -gt 0 ]; then
            echo "| dispatch failures | $dispatch_failures |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$dispatch_failures of $count dispatch(es) failed this tick."
            exit 1
          fi
