name: claude-improvement-recommender

# Daily proactive-improvement loop. Four specialist agents
# (autotiers-researcher/designer/engineer/qa) examine the app AND newly-available
# external inputs — fantasy-football rankings we can benchmark our tiers
# against, new tech/deps, UX best practices — and the highest-value
# recommendations are filed as `recommendation` issues. Those issues feed
# claude-implement-issue.yml (the user's chosen FULL autonomous loop), so a
# recommendation can become a merged PR unsupervised.
#
# Ships DRY_RUN: "true" — the run produces recommendations.json and logs the
# plan but files NOTHING, so the quality of recommendations can be judged for a
# few days before arming. Arm by flipping DRY_RUN to "false"; ramp MAX_ISSUES
# from 1 upward.
#
# TOKEN SPLIT (correctness-critical): issue CREATION uses PR_AUTHOR_PAT, NOT the
# built-in GITHUB_TOKEN. A GITHUB_TOKEN-created issue does not trigger any
# workflow (GitHub's recursion guard), and an App/bot-authored issue resolves to
# author_association NONE, which claude-implement-issue.yml refuses. Only a real
# user credential (the PAT) both fires `issues: opened` AND passes that
# trusted-author gate. (Same rule as the orphan sweeper's re-dispatch.)
#
# Design: docs/superpowers/specs/2026-07-02-improvement-recommender-design.md

on:
  schedule:
    # Daily 06:10 UTC — deliberately OFF the 08:xx scheduled cluster
    # (copilot-review=0, sweeper-health=17, fix-checks=30, orphan-sweeper=40,
    # resolve-conflicts=45, auto-merge=50), several of which also spend the
    # shared CLAUDE_CODE_OAUTH_TOKEN. This is a heavy job (one Opus parent + four
    # nested Opus specialists) and it kept quota-dying at 08:10 because it landed
    # right as that cluster saturated the rolling five-hour subscription window
    # (see run 28667269189). 06:10 gives it the quietest possible lookback: the
    # preceding five hours (01–06 UTC) are deep US night, when the event-driven
    # Claude jobs (implement-issue, fix-pr-checks, resolve-conflicts,
    # address-copilot-review) fire least. Minute 10 stays unique across the cron
    # set (a cron fires AT its minute field, so the minute is what must not
    # collide).
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Override DRY_RUN for a single manual run (true/false)."
        required: false
        type: string

concurrency:
  # Never let two ticks file overlapping issues.
  group: claude-improvement-recommender
  cancel-in-progress: false

permissions:
  contents: read # actions/checkout
  issues: read # GITHUB_TOKEN only LISTS issues for dedup; creation + label
  # bootstrap run on PR_AUTHOR_PAT, so the built-in token needs no issue write.
  id-token: write # claude-code-action mints its GitHub token via OIDC

env:
  # Ship SAFE: produce recommendations, file nothing, until a human has watched
  # a few days of output. Flip to "false" (start with MAX_ISSUES=1) to arm.
  DRY_RUN: "true"
  MAX_ISSUES: "10"
  REC_LABEL: "recommendation"
  LOOKBACK_DAYS: "30"

jobs:
  recommend:
    name: generate and file improvement recommendations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN: this workflow only READS the checkout (the
          # agents inspect the app) and never pushes a branch, so — unlike
          # claude-implement-issue.yml — it must NOT persist the long-lived
          # PR_AUTHOR_PAT into git's credential store, where the Bash-enabled
          # claude-code-action step could reach it. Issue creation below uses
          # the PAT explicitly via gh's GH_TOKEN env, not git's transport.
          fetch-depth: 0

      # Pre-provision the toolchain so the engineer/designer subagents can run
      # tests and inspect the live app, mirroring claude-implement-issue.yml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci

      # Gather recommendations already tracked (open, or closed within
      # LOOKBACK_DAYS) so the agent does not re-propose a standing idea. Pure
      # read on the built-in token.
      - name: Gather existing recommendations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since="$(date -u -d "-${LOOKBACK_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          gh issue list --repo "$REPO" --label "$REC_LABEL" --state open \
            --limit 200 --json number,title,state > open_recs.json
          gh issue list --repo "$REPO" --label "$REC_LABEL" --state closed \
            --search "closed:>=$since" --limit 200 \
            --json number,title,state > closed_recs.json
          jq -s 'add' open_recs.json closed_recs.json > existing_recs.json
          echo "::group::existing_recs.json"; cat existing_recs.json; echo "::endgroup::"

      - name: Generate candidate recommendations
        id: generate
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max), same as claude-implement-issue.yml.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the AutoTiers improvement recommender. Produce candidate
            improvement recommendations for THIS repository and write them to
            `candidates.json` at the repo root. You do NOT create GitHub issues —
            a later deterministic step selects and files them.

            EXECUTION MODEL — READ FIRST. You are running as a SINGLE headless,
            non-interactive CI invocation. Tool calls DO continue the agentic
            loop normally — you keep getting turns as long as you call tools. But
            there is NO continuation once you STOP: the run ends the instant you
            produce a final assistant message with no further tool calls, and
            nothing ever wakes you back up. So the only failure mode to avoid is
            stopping (or parking work off-thread) before candidates.json is
            written. Therefore:
              - Dispatch the four specialists SYNCHRONOUSLY and wait for each
                Task call's result to come back INLINE as a tool result within
                THIS session. Issuing all four Task calls together in one message
                is fine (they return together as tool results) — let those
                results come back and keep going in the same agentic loop.
              - Do NOT run any Task in the background / detached, do NOT set a
                run-in-background flag, and do NOT call ScheduleWakeup or any
                "I'll check back later" mechanism. Backgrounded work and any
                scheduled wakeup is ABANDONED the instant the run ends — its
                output is lost and candidates.json is never written. (This is the
                exact bug this instruction exists to prevent.)
              - Your job is not done until `candidates.json` physically exists at
                the repo root. Write it with the Write tool BEFORE your final
                (tool-call-free) message. Never finish while "waiting for" the
                specialists — their results arrive as inline tool results, not
                later.

            QUOTA BUDGET — this job runs one Opus parent plus four nested Opus
            specialists on a SHARED subscription token, and has quota-died when
            the fan-out ran unbounded. Keep the whole run lean:
              - In each specialist's Task prompt, cap the work explicitly: tell
                it to time-box its investigation, look only where its lane's
                highest-value findings live (do NOT crawl the whole repo), and
                return its TOP 3–5 findings only, as terse specs — not an
                exhaustive audit.
              - Do the minimum inspection yourself before dispatching; let the
                specialists do the digging, and don't re-do their work after.
            Fewer, sharper candidates beat a thorough run that never finishes.

            Dispatch these four specialists via the Task tool, each in its lane;
            run them and collect their findings:
              - autotiers-researcher: compare our tier/ranking output against
                newly-available public fantasy-football rankings / ADP
                (FantasyPros, ESPN, etc.) and flag divergences worth acting on;
                ALSO surface new libraries, tooling, or techniques relevant to
                our stack. Use WebSearch / WebFetch.
              - autotiers-designer: audit the existing link -> generate -> export
                flow against current UX best practices and new patterns.
              - autotiers-engineer: audit app internals (backend/app, web/src)
                for correctness, performance, and maintainability improvements.
              - autotiers-qa: hunt latent breakage the way QA does on a diff —
                untested code paths, likely regressions, validation gaps
                (empty/whitespace/null/wrong-type/out-of-range inputs),
                unverified third-party defaults (httpx UA, fetch creds,
                timeouts), and tests that would still pass if the code they
                guard were deleted; each finding becomes a spec to close the gap.

            `existing_recs.json` at the repo root lists recommendations already
            tracked as issues — do NOT re-propose anything substantially covered
            there.

            Write `candidates.json`: a JSON array where each element is
              {
                "title": "<one concise line>",
                "area": "rankings" | "tech" | "ux" | "internals" | "qa",
                "body": "<issue body: an auto-implement-ready spec with sections
                         Problem, Proposed change, Acceptance criteria,
                         Affected files>",
                "score": <number; your value/effort estimate, higher = ship first>
              }
            Emit as many strong candidates as you find (the next step dedups,
            ranks by score, and keeps only the best few). Each body must be
            precise enough for another agent to implement with no further human
            input. The repo's `.claude/skills/` and `.claude/agents/` are present
            in the checkout — use them.

            FINAL STEP (do not skip): after collecting the specialists' inline
            results, WRITE the assembled JSON array to `candidates.json` at the
            repo root, then confirm it exists (e.g. `cat candidates.json`) before
            your closing message. A run that ends without that file on disk has
            failed, regardless of how much analysis you did.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 120
            --allowedTools Edit,Write,Read,Glob,Grep,Bash,Task,WebSearch,WebFetch

      # Observability + no-op guard. The generation step swallows a bad run
      # silently (empty/absent candidates.json still exits the schedule green),
      # so a parent that never dispatched the four specialists is otherwise
      # indistinguishable from a legitimate "found nothing". Surface the run's
      # true shape — candidate count + the agent's own turn/cost metrics — and
      # raise a loud ::warning:: (never fail: a bad generation must not break the
      # schedule) when the run looks like a no-op. LOW_TURN_THRESHOLD is set well
      # below any real four-specialist fan-out (which runs many minutes and
      # dozens of turns); a run under it did not do the work.
      - name: Inspect generation
        env:
          EXECUTION_FILE: ${{ steps.generate.outputs.execution_file }}
          LOW_TURN_THRESHOLD: "20"
        run: |
          set -uo pipefail

          # Record whether the generator actually wrote the file BEFORE creating
          # any placeholder — a missing file (agent never emitted output) is a
          # stronger no-op signal than an explicit empty array, and the
          # placeholder would erase that distinction. The downstream Select step
          # still creates its own `[]` fallback; this one is diagnostic only.
          if [ -f candidates.json ]; then
            cand_present="true"
          else
            cand_present="false"
            echo "[]" > candidates.json
          fi
          cand_count="$(jq 'if type=="array" then length else 0 end' candidates.json 2>/dev/null || echo 0)"
          echo "::group::candidates.json (present=$cand_present)"; cat candidates.json; echo; echo "::endgroup::"

          # agent self-reported metrics from claude-code-action's execution log.
          # Pick the TERMINAL result event. The file's exact shape isn't
          # guaranteed — it may be a single JSON array, newline-delimited JSON,
          # or a concatenated object stream — so slurp (-s) into one array and
          # flatten (unwraps the single-array case to a flat event list without
          # touching object values), then take the last result event. `last`
          # over an empty set is null -> `// {}`.
          exec_file="$EXECUTION_FILE"
          [ -n "$exec_file" ] && [ -f "$exec_file" ] || exec_file="/home/runner/work/_temp/claude-execution-output.json"
          result='{}'
          if [ -f "$exec_file" ]; then
            result="$(jq -c -s 'flatten | map(select(type=="object" and .type=="result")) | last // {}' "$exec_file" 2>/dev/null || echo '{}')"
            # Stable copy so the artifact upload does not depend on the action's
            # output var resolving.
            cp "$exec_file" generation-execution.json 2>/dev/null || true
          fi
          num_turns="$(echo "$result"   | jq -r '.num_turns // "?"')"
          cost="$(echo "$result"        | jq -r '.total_cost_usd // "?"')"
          duration_ms="$(echo "$result" | jq -r '.duration_ms // "?"')"
          # NB: `.is_error // "?"` is wrong here — jq's `//` treats `false` as
          # empty, so a healthy is_error=false would render "?". Test for null.
          is_error="$(echo "$result"    | jq -r 'if .is_error == null then "?" else .is_error end')"
          # The result's `.result` text carries the terminal error message when
          # the run was cut off (e.g. "You've hit your session limit"). And the
          # execution stream records the true depth of the run: how many Task
          # (a.k.a. `Agent`) sub-agents were actually dispatched, and whether any
          # of them died mid-flight with an API/session-limit error. These are
          # what tell a QUOTA death apart from a genuine no-op — num_turns alone
          # does NOT (a session-limit interruption reports a tiny num_turns even
          # though the parent really did fan out; that misread cost two commits).
          result_text="$(echo "$result" | jq -r '.result // ""')"
          agent_calls=0
          agent_errors=0
          if [ -f generation-execution.json ]; then
            agent_calls="$(jq -s '[ .[] | .. | objects | select(.type=="tool_use" and (.name=="Task" or .name=="Agent")) ] | length' generation-execution.json 2>/dev/null || echo 0)"
            agent_errors="$(jq -s '[ .[] | .. | objects | select(.type=="tool_result") | .content? // [] | (if type=="array" then . else [] end) | .[] | .text? // "" | select(test("session limit|API error|hit your.*limit"; "i")) ] | length' generation-execution.json 2>/dev/null || echo 0)"
          fi
          quota_hit="false"
          if [ "$is_error" = "true" ] || echo "$result_text" | grep -qiE "session limit|hit your .*limit|rate.?limit"; then
            quota_hit="true"
          fi

          {
            echo "### Improvement recommender — generation"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| candidates.json written | $cand_present |"
            echo "| candidates written | $cand_count |"
            echo "| num_turns | $num_turns |"
            echo "| total_cost_usd | $cost |"
            echo "| duration_ms | $duration_ms |"
            echo "| is_error | $is_error |"
            echo "| Task sub-agents dispatched | $agent_calls |"
            echo "| sub-agents killed by quota | $agent_errors |"
            echo "| quota/session-limit death | $quota_hit |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "candidates_present=$cand_present candidates=$cand_count num_turns=$num_turns cost=$cost duration_ms=$duration_ms is_error=$is_error agent_calls=$agent_calls agent_errors=$agent_errors quota_hit=$quota_hit"

          # Failure taxonomy — distinguish the THREE ways an empty run happens,
          # because they demand different responses (the earlier guard conflated
          # them and blamed "specialists never dispatched" for what was really a
          # quota death — see run 28667269189, which DID dispatch all four Task
          # agents before the shared five-hour Pro/Max window rejected them).
          #
          #   1. QUOTA DEATH  — is_error / a "session limit" terminal message, or
          #      sub-agents that returned an API-error stub. The fan-out DID run;
          #      it was starved of tokens. Fix = reduce/relocate quota pressure,
          #      NOT the prompt. This is the loud one.
          #   2. NO DISPATCH  — zero Task sub-agents in the stream AND a low turn
          #      count. This is the original "orchestrator returned without
          #      fanning out" failure the prompt fix targeted.
          #   3. GENUINE NO-OP — the run completed cleanly (is_error=false, no
          #      quota signal, agents dispatched) but found nothing to propose.
          if [ "$quota_hit" = "true" ]; then
            echo "::warning title=Recommender starved by quota (NOT a dispatch bug)::The run hit the shared five-hour subscription limit. Task sub-agents dispatched=$agent_calls, killed by quota=$agent_errors, is_error=$is_error. The four-specialist fan-out DID run — do NOT chase the prompt/dispatch wording. Reduce quota pressure: relocate the schedule away from other CLAUDE_CODE_OAUTH_TOKEN jobs' burn window, cut specialists' --max-turns, or enable overage. See metrics + artifact."
          elif [ "$cand_present" != "true" ] && [ "$agent_calls" -eq 0 ] 2>/dev/null; then
            echo "::warning title=Recommender never dispatched specialists::No Task sub-agents appear in the execution stream and no candidates.json was written — the orchestrator returned without fanning out. This is the dispatch failure (distinct from a quota death, which shows agent_calls>0)."
          elif [ "$cand_present" != "true" ]; then
            echo "::warning title=Recommender wrote no candidates.json::The generator dispatched $agent_calls sub-agent(s) but never emitted candidates.json. Check the artifact — the parent likely stopped before writing output."
          elif [ "$cand_count" = "0" ]; then
            echo "::notice title=Recommender produced no candidates::candidates.json is an empty array with a clean run ($agent_calls sub-agents, is_error=$is_error, no quota signal) — most likely a genuine 'nothing to improve'. Confirm via the artifact if this repeats."
          fi
          # Secondary tell only — a low num_turns is NOT decisive on its own: a
          # quota interruption reports a tiny num_turns even after a full fan-out.
          # Only warn on it when the stream ALSO shows no dispatch and no quota
          # death, so it never re-fires the phantom "no fan-out" alarm on a quota
          # run (which already warned above).
          if [ "$num_turns" != "?" ] && [ "$num_turns" -lt "$LOW_TURN_THRESHOLD" ] 2>/dev/null \
             && [ "$quota_hit" != "true" ] && [ "$agent_calls" -eq 0 ] 2>/dev/null; then
            echo "::warning title=Recommender turn count implausibly low::num_turns=$num_turns (< $LOW_TURN_THRESHOLD) with zero Task sub-agents and no quota signal — the parent returned without dispatching the specialists."
          fi

      # Preserve the generation's raw output so a green-but-empty run can be
      # diagnosed after the fact (candidates vs the agent's execution stream).
      - name: Upload generation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommender-generation
          path: |
            candidates.json
            generation-execution.json
          if-no-files-found: warn
          retention-days: 14

      # Deterministic selection: dedup vs existing issues + already-kept
      # candidates, order by score, cap to MAX_ISSUES. A missing or garbage
      # candidates.json yields [] and never fails the schedule.
      - name: Select recommendations to file
        run: |
          set -euo pipefail
          [ -f candidates.json ] || echo "[]" > candidates.json
          python3 backend/scripts/improvement_recommend_select.py \
            --candidates candidates.json \
            --existing existing_recs.json \
            --max "$MAX_ISSUES" > recommendations.json
          echo "::group::recommendations.json"; cat recommendations.json; echo "::endgroup::"

      # File each selected recommendation as an issue, AUTHENTICATED as
      # PR_AUTHOR_PAT so claude-implement-issue fires and its trusted-author gate
      # passes. DRY_RUN files nothing.
      - name: File recommendation issues
        env:
          GH_TOKEN: ${{ secrets.PR_AUTHOR_PAT }}
          REPO: ${{ github.repository }}
          DRY_RUN_OVERRIDE: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_run="${DRY_RUN_OVERRIDE:-$DRY_RUN}"
          echo "DRY_RUN=$dry_run"
          count="$(jq 'length' recommendations.json)"
          echo "selected $count recommendation(s)"
          [ "$count" -gt 0 ] || { echo "nothing to file."; exit 0; }

          if [ "$dry_run" != "true" ]; then
            gh label create "$REC_LABEL" --repo "$REPO" \
              --color 0e8a16 --description "Proactive improvement recommendation (auto-filed)" \
              2>/dev/null || true
          fi

          jq -c '.[]' recommendations.json | while read -r row; do
            title="$(echo "$row" | jq -r .title)"
            body="$(echo "$row" | jq -r .body)"
            area="$(echo "$row" | jq -r .area)"
            echo "recommendation [$area]: $title"
            # Defense-in-depth: the selector already drops empty-title/body
            # candidates, so an empty field here means malformed selector output
            # — skip rather than file a titleless/bodyless issue.
            if [ -z "$title" ] || [ -z "$body" ]; then
              echo "skip: empty title or body"; continue
            fi
            if [ "$dry_run" = "true" ]; then
              echo "(dry-run) would file issue."
              continue
            fi
            printf '%s\n\n_Filed by `claude-improvement-recommender.yml` (area: %s)._' \
              "$body" "$area" \
              | gh issue create --repo "$REPO" --label "$REC_LABEL" \
                  --title "$title" --body-file -
          done
