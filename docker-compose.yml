services:
  db:
    image: postgres:16-alpine
    container_name: autotiers-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-autotiers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - autotiers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autotiers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotiers-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-autotiers}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-autotiers}
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
      RUN_SCHEDULER: "false"
      ADMIN_API_KEY: ""
      SEED_DEV_DATA: "${SEED_DEV_DATA:-true}"
    # Dev-only hot reload. The image CMD intentionally omits --reload (prod-safe);
    # restore it here since dev mounts source below. Do NOT add --reload to the
    # prod image — it breaks the scheduler (see backend/Dockerfile).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Hot reload — mount source into the container
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: autotiers-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-8000}"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
      - ./web/tailwind.config.ts:/app/tailwind.config.ts
      - ./web/components.json:/app/components.json
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/postcss.config.js:/app/postcss.config.js

volumes:
  autotiers_pgdata:
