[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotiers-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "orjson>=3.11.9",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pandas>=3.0.5",
    "jenkspy>=0.4.1",
    "httpx>=0.28.1",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.2.2",
    "nfl_data_py>=0.3,<0.3.3",
    "rapidfuzz>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "aiobotocore[boto3]>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.163.0",
    "aiosqlite>=0.22.1",
    "respx>=0.23.1",
    # test_infra_apply_workflow.py parses the infra workflow YAML; pin PyYAML
    # explicitly so the suite doesn't rely on it being present transitively.
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Migrations are generated/declarative; not unit-testable.
    "app/database.py",  # boilerplate engine/session factory
    "alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
