[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotiers-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "alembic>=1.18.4",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pandas>=3.0.3",
    "jenkspy>=0.3",
    "httpx>=0.28.1",
    "apscheduler>=3.11.2",
    "python-dotenv>=1.2.2",
    "nfl_data_py>=0.3,<0.3.3",
    "rapidfuzz>=3.14.5",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "aiosqlite>=0.22.1",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Migrations are generated/declarative; not unit-testable.
    "app/database.py",  # boilerplate engine/session factory
    "alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
